apis:
- aid: open-financial:virtual-accounts
  name: Open Zwitch Virtual Accounts API
  description: >-
    Programmatic creation and management of virtual accounts used as transfer wallets, collection wallets,
    and collection tools on top of partner-bank infrastructure. Virtual accounts give platforms a unique
    IFSC-and-account-number pair for each end customer so that inbound transfers (NEFT, IMPS, RTGS, UPI)
    auto-reconcile to the correct beneficiary, and outbound payouts can be debited from a controlled sub-ledger.
  humanURL: https://developers.zwitch.io/reference/virtual-accounts
  baseURL: https://api.zwitch.io/v1
  tags:
  - Virtual Accounts
  - Subaccounts
  - Reconciliation
  tags_raw:
  - Virtual Accounts
  - Sub-Accounts
  - Reconciliation
  properties:
  - type: Documentation
    url: https://developers.zwitch.io/reference/virtual-accounts
  - type: Authentication
    url: https://developers.zwitch.io/reference/authorization
- aid: open-financial:transfers
  name: Open Zwitch Transfers API
  description: >-
    Initiate single or bulk fund transfers from a virtual account to bank beneficiaries over NEFT, IMPS,
    or RTGS, and inspect transfer status, UTR, and settlement details. Powers vendor payouts, refunds,
    reimbursements, payroll, and split disbursements.
  humanURL: https://developers.zwitch.io/reference/transfers
  baseURL: https://api.zwitch.io/v1
  tags:
  - Payouts
  - Transfers
  - NEFT
  - IMPS
  - RTGS
  properties:
  - type: Documentation
    url: https://developers.zwitch.io/reference/transfers
  - type: Documentation
    url: https://developers.zwitch.io/docs/bulk-transfers
- aid: open-financial:beneficiaries
  name: Open Zwitch Beneficiaries API
  description: >-
    Manage the set of bank-account beneficiaries that can be paid from a virtual account. Supports creating
    beneficiaries, listing, retrieving, updating, and deleting, with optional penny-drop validation before
    the beneficiary becomes eligible for payouts.
  humanURL: https://developers.zwitch.io/reference/beneficiaries
  baseURL: https://api.zwitch.io/v1
  tags:
  - Beneficiaries
  - Payouts
  properties:
  - type: Documentation
    url: https://developers.zwitch.io/reference/beneficiaries
- aid: open-financial:upi
  name: Open Zwitch UPI API
  description: >-
    UPI collect requests, UPI Intent strings, and dynamic UPI QR codes for accepting customer-initiated
    payments on India's Unified Payments Interface rails. Includes mandate flows and webhook callbacks
    for payment success / failure events.
  humanURL: https://developers.zwitch.io/reference/upi
  baseURL: https://api.zwitch.io/v1
  tags:
  - UPI
  - Collect
  - QR
  - Payments
  properties:
  - type: Documentation
    url: https://developers.zwitch.io/reference/upi
- aid: open-financial:layer
  name: Open Layer Payment Gateway API
  description: >-
    Layer is Zwitch's hosted payment gateway. A few lines of layer.js render a fully PCI-compliant checkout
    pop-up that accepts net banking, UPI, credit/debit cards, and wallets. Server-side APIs create payment
    tokens, query payment status, issue full and partial refunds (including batch refunds), and download
    settlement reports. Mobile SDKs are available for Android, iOS, and Flutter.
  humanURL: https://developers.zwitch.io/docs/layer
  baseURL: https://api.zwitch.io/v1
  tags:
  - Payment Gateway
  - Checkout
  - Cards
  - UPI
  - Net Banking
  - Refunds
