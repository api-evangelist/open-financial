        '422':
          description: '422'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"error\": {\n    \"type\": \"invalid_request_error\",\n    \"code\": \"parameter_missing\",\n    \"message\": \"The vpa field format is invalid\",\n    \"param\": \"vpa\"\n  }\n}"
