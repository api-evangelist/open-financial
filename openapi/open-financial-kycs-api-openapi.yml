          application/json:
            schema:
              type: object
              required:
              - vpa
              - merchant_reference_id
              properties:
                vpa:
                  type: string
                  description: 'The VPA handle you want to verify.<br><br>Example: `anil.reddy@example`'
                merchant_reference_id:
                  type: string
                  description: 'Unique identifier entered when creating the verification request.<br><ul><li>Only alphabets and numbers are allowed.</li><li>Minimum: 7 characters.</li><li>Maximum: 40 characters.</li></ul>Example: `1409614085`'
            examples:
              Verify VPA:
                value:
                  vpa: anil-reddy@example
                  merchant_reference_id: '1000876'
                  metadata:
                    key_1: DD
                    key_2: XOF
