paths:
  /v1/events:
    get:
      summary: Get All Webhook Events
      description: Use this API to get a list of all webhook events triggered by you.
      operationId: webhooks-get-all-events
      parameters:
      - name: delivery_status
        in: query
        description: Enter the delivery status for which you want to get webhook events.<br><br>Possible values:<ul><li>`success`</li><li>`failed`
        schema:
          type: string
      - name: start_before
        in: query
        description: 'Enter the `event_id` before which you want to retrieve events.<br><br>Use this in combination with the `results_per_page` parameter for pagination.<br><br>Example: `evl_nCm4Qstg76LGtY7IyF86DdMAG`'
        schema:
          type: string
      - name: start_after
        in: query
        description: 'Enter the `event_id` after which you want to retrieve events.<br><br>Use this in combination with the `results_per_page` parameter for pagination.<br><br>Example: `evl_nCm4Qstg76LGtY7IyF86DdCAG`'
        schema:
          type: string
      - name: results_per_page
        in: query
        description: 'Number of  events you want to retrieve.<br><br>Use this in combination with the `start_before` or `start_after` parameter for pagination.<br><ul><li>Default value 10.</li><li>Maximum value 100.</ul></li>Example: `15`'
        schema:
          type: string
          default: '10'
      - name: from_date
        in: query
        description: '**Has to be used with `to_date`**.<br><br>The UNIX timestamp after which details should be returned.<br><br>Use this with the `results_per_page`, `start_after`, and `start_before` for pagination.<br><br>Example: `1651052818`'
        schema:
          type: string
      - name: to_date
        in: query
        description: '**Has to be used with `from_date`**.<br><br>The UNIX timestamp before which details should be returned.<br><br>Use this with the `results_per_page`, `start_after`, and `start_before` for pagination.<br><br>Example: `1651052818`'
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"object\": \"list\",\n  \"has_more\": true,\n  \"data\": [\n    {\n      \"id\": \"evl_nCm4Qstg76LGtY7IyF86DdMAG\",\n      \"object\": \"event\",\n      \"name\": \"transfers.created\",\n      \"delivery_status\": \"success\",\n      \"is_sandbox\": true,\n      \"data\": {\n        \"object\": {\n          \"id\": \"tr_lPOze2peSBhh7iBrh09NCv9ki\",\n          \"object\": \"transfer\",\n          \"type\": \"wallet\",\n          \"amount\": 1.01,\n          \"debit_account_id\": \"va_Q6USeYXbx38cKa3NbBpoHDViW\",\n          \"credit_account_id\": \"va_MDOShxKdcWpm7vEr2yDVb88EP\",\n          \"status\": \"success\",\n          \"currency_code\": \"inr\",\n          \"payment_remark\": \"Haircut and beard styling\",\n          \"paid_to\": \"36363651429896978\",\n          \"metadata\": {\n            \"key_1\": \"DD\",\n            \"key_2\": \"XOF\"\n          },\n          \"merchant_reference_id\": \"1409614085\",\n          \"transacted_at\": 1641823944,\n          \"created_at\": 1641823944\n        }\n      }\n    },\n    {\n      \"id\": \"evl_ptCj45O8VO2ZyusRmoUINr0h4\",\n      \"object\": \"event\",\n      \"name\": \"transfers.created\",\n      \"delivery_status\": \"success\",\n      \"is_sandbox\": true,\n      \"data\": {\n        \"object\": {\n          \"id\": \"tr_Jq8EUThLjWFlW7aOe2wD9dcei\",\n          \"object\": \"transfer\",\n          \"type\": \"vpa\",\n          \"amount\": 1.01,\n          \"status\": \"pending\",\n          \"bank_reference_number\": \"133210595390575\",\n          \"bank_error_code\": \"bad_timeout_at_bank\",\n          \"currency_code\": \"inr\",\n          \"message\": \"Gateway Timeout\",\n          \"reason_for_error\": \"An upstream service times out\",\n          \"error_type\": \"technical\",\n          \"recommended_action\": \"Do get status after 30 Minutes and act basis the response\",\n          \"payment_mode\": \"upi\",\n          \"payment_remark\": \"Haircut and beard styling\",\n          \"paid_to\": \"9999999999@ybl\",\n          \"metadata\": {\n            \"key_1\": \"DD\",\n            \"key_2\": \"XOF\"\n          },\n          \"merchant_reference_id\": \"1409614085\",\n          \"transacted_at\": 1641823866,\n          \"created_at\": 1641823866\n        }\n      }\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  has_more:
                    type: boolean
                    example: true
                    default: true
                  data:
                    type: array
                    items:
                      type: object
