              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: invalid_request_error
                      code:
                        type: string
                        example: resource_missing
                      message:
                        type: string
                        example: The results_per_page field must be numeric value between 1 and 100
                      param:
                        type: string
                        example: results_per_page
      deprecated: false
      tags:
