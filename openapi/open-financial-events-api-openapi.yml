                                      type: string
                                      example: DD
                                    key_2:
                                      type: string
                                      example: XOF
                                merchant_reference_id:
                                  type: string
                                  example: '1409614085'
                                transacted_at:
                                  type: integer
                                  example: 1641823944
                                  default: 0
                                created_at:
                                  type: integer
                                  example: 1641823944
                                  default: 0
