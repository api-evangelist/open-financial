  /v1/constants/business-types:
    get:
      summary: Business Types
      description: Use this API to get a list of business types used by ZWITCH APIs.
      operationId: constants-business-types
      parameters:
      - name: start_after
        in: query
        description: 'The business type after which you want to get details.<br> Use this with the `results_per_page` for pagination.<br><br>Example: `individual`'
        schema:
          type: string
      - name: start_before
        in: query
        description: 'The business type before which you want to get details.<br> Use this with the `results_per_page` for pagination.<br><br>Example: `individual`'
        schema:
          type: string
      - name: results_per_page
        in: query
        description: 'The number of results you want to get per API call.<br>Use this with the `start_before` or `start_after` parameters for pagination.<ul><li>Default value 10.<li>Maximum value 100.</ul></li>Example: 15'
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"object\": \"list\",\n    \"has_more\": false,\n    \"data\": [\n        {\n            \"ID\": \"individual\",\n            \"Name\": \"Individual\"\n        },\n        {\n            \"ID\": \"proprietership-or-huf\",\n            \"Name\": \"Sole Proprietership/HUF\"\n        },\n        {\n            \"ID\": \"partnership\",\n            \"Name\": \"Partnership\"\n        },\n        {\n            \"ID\": \"private-limited\",\n            \"Name\": \"Private Limited\"\n        },\n        {\n            \"ID\": \"trust-or-societies\",\n            \"Name\": \"Trust/Societies\"\n        },\n        {\n            \"ID\": \"llp\",\n            \"Name\": \"LLP\"\n        },\n        {\n            \"ID\": \"others\",\n            \"Name\": \"Others\"\n        },\n        {\n            \"ID\": \"unregistered-business\",\n            \"Name\": \"Unregistred Business\"\n        },\n        {\n            \"ID\": \"public-limited\",\n            \"Name\": \"Public Limited\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  has_more:
                    type: boolean
                    example: false
                    default: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        ID:
                          type: string
                          example: individual
                        Name:
                          type: string
                          example: Individual
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"error\": {\n    \"type\": \"authentication_error\",\n    \"message\": \"Invalid secret key.\"\n  }\n}"
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        example: authentication_error
                      message:
                        type: string
                        example: Invalid secret key.
      deprecated: false
      tags:
      - Constants
  /v1/constants/ifsc-codes:
