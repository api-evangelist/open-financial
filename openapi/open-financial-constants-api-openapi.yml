      operationId: constants-ifsc
      parameters:
      - name: start_after
        in: query
        description: 'The `ID` after which you want to get details.<br> Use this with the `results_per_page` for pagination.<br><br>Example: `if_GfmeVccbAkV4uEK47T48`'
        schema:
          type: string
      - name: start_before
        in: query
        description: 'The `ID` before which you want to get details.<br> Use this with the `results_per_page` for pagination.<br><br>Example: `if_GlvUn3FWir2YirsFFw1y`'
        schema:
          type: string
      - name: results_per_page
        in: query
        description: 'The number of results you want to get per API call.<br>Use this with the `start_before` or `start_after` parameters for pagination.<ul><li>Default value 10.<li>Maximum value 100.</ul></li>Example: 15'
        schema:
          type: string
      - name: ifsc_code
        in: query
        description: 'The IFSC code for which you want to get details.<br><br>Example: `ABHY0000004`'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
