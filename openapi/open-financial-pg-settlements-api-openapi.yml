  title: Open Financial Pg Settlements API
  version: '1'
  description: 'Operations tagged Pg Settlements across 2 of this provider''s published API definitions: open-financial-1-openapi.yml, open-financial-5-openapi.yml. Each path carries the servers of the definition it was published in.'
