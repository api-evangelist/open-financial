paths:
  /pg_settlements/sub_accounts:
    put:
      summary: Update Sub Account
      description: Use this API to update the sub account details.
      operationId: update-sub-account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - sub_accounts_id
              properties:
                sub_accounts_id:
                  type: string
                  description: The sub accounts id created during the sub_account onboarding
                recepient_name:
                  type: string
                  description: recepient_name
                email_id:
                  type: string
                  description: Email address of the sub-account
                mobile_number:
                  type: string
                  description: Mobile number of the sub-account
                bene_account_number:
                  type: string
                  description: Account Number of the sub-account
                ifsc_code:
                  type: string
                  description: IFSC of the account
                branch_name:
                  type: string
                  description: Branch name corresponding to the IFSC provided
                bank_name:
                  type: string
                  description: Bank name of the sub-account's account number
            examples:
              Update Sub_account:
                value:
                - recepient_name: John Doe
                  email_id: john.doe@gmail.co
                  mobile_number: 7558042380
                  bene_account_number: 9990009991
                  branch_name: HSR
                  bank_name: KOTAK MAHINDRA BANK
                  ifsc_code: KKBK0008072
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"data\": [\n        {\n            \"sub_accounts_id\": \"sa_c7b14dc8cf5c\",\n            \"recepient_name\": \"Test\",\n            \"email_id\": \"test@bankopen.co\",\n            \"mobile_number\": \"1766666889\",\n            \"status\":\"pending\" , once changed to active or disabled , update won't work\n            \"bene_account_number\": \"0416201006112\",\n            \"ifsc_code\": \"KKBK0008072\",\n            \"bank_name\": \"KOTAK MAHINDRA BANK\",\n            \"branch_name\": \"KOTAK MAHINDRA BANK\"\n        }\n    ],\n    \"meta\": {\n        \"pagination\": {\n            \"total\": 1,\n            \"count\": 1,\n            \"per_page\": 15,\n            \"current_page\": 1,\n            \"total_pages\": 1,\n            \"links\": {}\n        }\n    },\n    \"status\": 200\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Pg Settlements
    get:
      summary: Get All Sub-Accounts
      description: ''
      operationId: get-all-sub-accounts
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"data\": [\n        {\n            \"sub_accounts_id\": \"sa_c7b14dc8cf5c\",\n            \"recepient_name\": \"Test\",\n            \"status\" : \"pending\",\n            \"email_id\": \"test@bankopen.co\",\n            \"mobile_number\": \"1766666889\",\n            \"bene_account_number\": \"0416201006112\",\n            \"ifsc_code\": \"KKBK0008072\",\n            \"bank_name\": \"KOTAK MAHINDRA BANK\",\n            \"branch_name\": \"KOTAK MAHINDRA BANK\"\n        },\n        {\n            \"sub_accounts_id\": \"sa_c0175790d4e8\",\n            \"recepient_name\": \"Asif\",\n            \"status\" : \"pending\",\n            \"email_id\": \"asif11@bankopen.co\",\n            \"mobile_number\": \"8301834098\",\n            \"bene_account_number\": \"188301834097\",\n            \"ifsc_code\": \"INDB0000010\",\n            \"bank_name\": \"INDUSIND BANK\",\n            \"branch_name\": \"INDUSIND BANK\"\n        }\n    \"meta\": {\n        \"pagination\": {\n            \"total\": 3,\n            \"count\": 3,\n            \"per_page\": 15,\n            \"current_page\": 1,\n            \"total_pages\": 1,\n            \"links\": {}\n        }\n    },\n    \"status\": 200\n}"
        '400':
          description: '400'
