paths:
  /v1/kycs/name-match:
    post:
      summary: Name Verification - PAN vs Account Verification
      description: Use this API to verify the PAN name with their existing Bank account name.
      operationId: verifications-pan-vs-account-verification-create
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - pan_verification_id
              - account_verification_id
              - minimum_match_score
              properties:
                type:
                  type: string
                  description: 'The inputs you want to use to compare the individual''s name.<br><br>Accepted value: `pan_vs_account_verification`'
                pan_verification_id:
                  type: string
                  description: 'Unique identifier obtained when the applicant''s PAN is digitally verified.<br><br>Use the <a href="https://developers.zwitch.io/reference/verifications-pan" target="_blank">PAN Verification API</a> to digitally verify the applicant''s PAN.<br><br>Has to be 29 characters.<br><br>Example: `pan_SYkpuiAbXC9ZHUmf2YuYFvGW1`<br><br>Supported characters: <ul><li>`A-Z`</li><li>`a-z`</li><li>`0-9`</li></ul>'
                account_verification_id:
                  type: string
                  description: 'Unique identifier of the account verification request in the ZWITCH database.<br><br>Use our <a href="https://developers.zwitch.io/reference/verifications-bank-account-create" target="_block">Bank Account Verification API</a> to verify your applicant''s account and get the unique identifier.<br><br>Has to be 32 characters.<br><br>Example: `accver_T7tf1mHC4Cgd544uQhuoLNDd5`<br><br>Supported characters: <ul><li>`A-Z`</li><li>`a-z`</li><li>`0-9`</li></ul>'
                minimum_match_score:
                  type: number
                  description: 'The minimum acceptable match score set by you.<ul><li>Minimum value: `60`</li><li>Maximum score: `100`</li><li>Whole numbers only</li></ul>Example: `75`'
                  format: float
                metadata:
                  type: object
                  description: 'Key-value pair that can be used to store additional information about the entity. <ul><li>Each pair cannot exceed 256 characters. <li>Maximum 5 key-value pairs.</ul></li>Example: `"key_1": "Zwitch to the moon.”`'
                  properties:
                    Key_1:
                      type: string
                    Key_2:
                      type: string
            examples:
              Name Match Account vs Verification:
                value:
                  type: pan_vs_account_verification
                  pan_verification_id: pan_vTQ7sBPRAApHORmN5PfT3Uk3N
                  account_verification_id: accver_wIEhmszz13go8eiUSbYDZlBKu
                  minimum_match_score: 60.5
                  metadata:
                    key_1: DD
                    key_2: XOF
      responses:
