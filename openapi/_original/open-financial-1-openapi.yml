  /refund/batch:
    post:
      summary: Batch Refund API
      description: Initiates a batch of refunds in a single request. Each refund item is processed independently — some may succeed while others are rejected within the same batch.
      operationId: batch-refund-api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - refund_batch_id
              - refunds
              properties:
                refund_batch_id:
                  type: string
                  description: Unique batch identifier from the merchant. Must not have been used before for this merchant.
                refunds:
                  type: array
                  description: List of refund items in the batch.
                  items:
                    properties:
                      payment_id:
                        type: string
                        description: Open PG transaction ID of the payment to refund.
                      amount:
                        type: number
                        description: Refund amount (supports decimals).
                        format: float
                      merchant_reference_id:
                        type: string
                        description: Unique reference ID per refund item from the merchant.
                    required:
                    - payment_id
                    - amount
                    - merchant_reference_id
                    type: object
            examples:
              Batch Refund:
                value:
                  refund_batch_id: BATCH-2026-001
                  refunds:
                  - payment_id: opg_abc1234567
                    amount: 500
                    merchant_reference_id: MER-REF-001
                  - payment_id: opg_xyz9876543
                    amount: 250
                    merchant_reference_id: MER-REF-002
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"batch_status\": \"success\",\n  \"refund_batch_id\": \"BATCH-2026-001\",\n  \"refunds\": [\n    {\n      \"refund_id\": \"rf_xxxxxxxxxxxx\",\n      \"amount\": 500.00,\n      \"refund_status\": \"request_initiated\",\n      \"message\": \"Request initiated successfully\",\n      \"merchant_reference_id\": \"MER-REF-001\"\n    },\n    {\n      \"refund_id\": \"rf_yyyyyyyyyyyy\",\n      \"amount\": 250.00,\n      \"refund_status\": \"rejected\",\n      \"message\": \"Payment is not in a refundable status\",\n      \"merchant_reference_id\": \"MER-REF-002\"\n    }\n  ]\n}\n\n"
              schema:
                type: object
                properties:
                  batch_status:
                    type: string
                    example: success
                  refund_batch_id:
                    type: string
                    example: BATCH-2026-001
                  refunds:
                    type: array
                    items:
                      type: object
                      properties:
                        refund_id:
                          type: string
                          example: rf_xxxxxxxxxxxx
                        amount:
                          type: integer
                          example: 500
                          default: 0
                        refund_status:
                          type: string
                          example: request_initiated
                        message:
                          type: string
                          example: Request initiated successfully
                        merchant_reference_id:
                          type: string
                          example: MER-REF-001
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /refund/batch/requery:
    get:
      summary: Requery Batch Refund
      description: ''
      operationId: requery-batch-refund
      parameters:
      - name: refund_batch_id
        in: query
        description: Fetch all refunds belonging to a batch.
        schema:
          type: string
      - name: refund_id
        in: query
        description: Fetch a single refund by its system-generated ID.
        schema:
          type: string
      - name: merchant_reference_id
        in: query
        description: Fetch a single refund by the merchant's reference ID.
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"refund_batch_id\": \"BATCH-2026-001\",\n  \"refunds\": [\n    {\n      \"refund_id\": \"rf_xxxxxxxxxxxx\",\n      \"payment_id\": \"opg_abc1234567\",\n      \"amount\": 500.00,\n      \"refund_status\": \"request_initiated\",\n      \"merchant_reference_id\": \"MER-REF-001\",\n      \"refund_batch_id\": \"BATCH-2026-001\"\n    }\n  ]\n}\n\n"
              schema:
                type: object
                properties:
                  refund_batch_id:
                    type: string
                    example: BATCH-2026-001
                  refunds:
                    type: array
                    items:
                      type: object
                      properties:
                        refund_id:
                          type: string
                          example: rf_xxxxxxxxxxxx
                        payment_id:
                          type: string
                          example: opg_abc1234567
                        amount:
                          type: integer
                          example: 500
                          default: 0
                        refund_status:
                          type: string
                          example: request_initiated
                        merchant_reference_id:
                          type: string
                          example: MER-REF-001
                        refund_batch_id:
                          type: string
                          example: BATCH-2026-001
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /v1/accounts:
    get:
      summary: Get All Accounts
      description: Use this API to get details of all accounts created by you.
      operationId: accounts-get-all
      parameters:
      - name: results_per_page
        in: query
        description: 'The number of results to be returned per API call.<br><br>Use this with the `start_before` or `start_after` parameters for pagination.<br><ul><li>Default value 10.</li><li>Maximum value 100.</li></ul>Example: `15`'
        schema:
          type: string
          default: '10'
      - name: start_before
        in: query
        description: 'The `account_id` before which details should be returned.<br><br>Use this with the `results_per_page` for pagination.<br><br>Example: `va_GtkNV8sHqmGBZUnv1iHpHm4M4`'
        schema:
          type: string
      - name: start_after
        in: query
        description: 'The `account_id` after which details should be returned.<br><br>Use this with the `results_per_page` for pagination.<br><br>Example: `va_GtkNV8sHqmGBZUnv1iHpHm4M4`'
        schema:
          type: string
      - name: from_date
        in: query
        description: '**Has to be used with `to_date`**. <br><br>The UNIX timestamp after which details should be returned.<br><br>Use this with the `results_per_page`, `start_after`, and `start_before` for pagination.<br><br>Example: `1651052818`'
        schema:
          type: string
      - name: to_date
        in: query
        description: '**Has to be used with `from_date`**.<br><br>The UNIX timestamp before which details should be returned.<br><br>Use this with the `results_per_page`, `start_after`, and `start_before` for pagination.<br><br>Example: `1651052818`'
        schema:
          type: string
      - name: type
        in: query
        description: Get a list of all accounts matching the entered `type`.<br><br>Accepted values:<ul><li>`virtual`</li></ul>
        schema:
          type: string
      - name: email
        in: query
        description: 'Get a list of all accounts matching the entered `email`.<br><br>Example: `anil.reddy@example.com`'
        schema:
          type: string
      - name: mobile_number
        in: query
        description: 'Get a list of all accounts matching the entered `mobile_number`.<br><br>Example: `9876543210`'
        schema:
          type: string
      - name: used_as
        in: query
        description: '**Can only be used with `type` set as `virtual`**.<br><br>Get a list of all accounts matching the entered `used_as`.<br><br>Possible values:<ul><li>`wallet`</li><li>`collection_tool`</li><li>`receivable`</li><li>`primary`</li><li>`verification`</li></ul>'
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
