  /v1/transfers:
    post:
      summary: Create Transfer - Account Beneficiary
      description: Use this API to transfer money from a virtual account to an account number beneficiary.
      operationId: transfers-virtual-accounts-create-to-account-beneficiary
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - debit_account_id
              - beneficiary_id
              - amount
              - currency_code
              - payment_mode
              - merchant_reference_id
              properties:
                type:
                  type: string
                  description: 'The account type to which you want to make the transfer. <br><br>Possible value: `account_number`'
                  default: account_number
                debit_account_id:
                  type: string
                  description: 'The `account_id` from which money should be debited.<br><br>Example: `va_Q6USeYXbx38cKa3NbBpoHDViW`'
                beneficiary_id:
                  type: string
                  description: 'The `account_id` to which money should be credited.<br><br>Example: `vab_ZPdnNajZkGlu5xrNDVjZNrb3d`'
                amount:
                  type: number
                  description: 'Amount you want to transfer in rupees.<br><br>Example: `369.71`'
                  format: float
                currency_code:
                  type: string
                  description: 'ISO code of the currency in which you want to make the transfer.<br>Currently, only `inr` is allowed.<br><br>Example: `inr`'
                  default: inr
                payment_mode:
                  type: string
                  description: The mode you want to use to make the transfer.<br>Possible values:<ul><li>`neft`<li>`imps` <li>`rtgs`</ul></li>
                async:
                  type: boolean
                  description: 'Helps improve success rate when creating multiple transfers in a short duration.<br><br>Possible values:<ul><li>`true`: The transfer is added to a queue and sent to the bank asynchronously. <li>`false` (default): The transfer request is sent to the bank immediately.</ul></li>'
                  default: false
                merchant_reference_id:
                  type: string
                  description: 'Unique identifier entered when creating the transfer.<br><ul><li>Only alphabets and numbers are allowed.</li><li>Minimum: 7 characters.</li><li>Maximum: 40 characters.</li></ul>Example: `1409614085`'
                payment_remark:
                  type: string
                  description: 'Remark for the transfer. This is shown in the bank statement.<ul><li>Only alphabets and numbers are allowed.</li><li>Minimum: 1 character.</li><li>Maximum: 40 characters.</li></ul>Example: `Transfer via ZWITCH.`'
                metadata:
                  type: object
                  description: 'Key-value pair that can be used to store additional information about the entity.<br><br>Note:<ul><li>Maximum 5 key-value pairs. </li><li>Maximum 256 characters in the `metadata` object.</li><li>You cannot pass a URL.</li><li>You cannot use `\`.</li></ul>Example: `"key_1": "DD"`'
                  properties:
                    key_1:
                      type: string
                    key_2:
                      type: string
            examples:
              Account Number:
                value:
                  type: account_number
                  debit_account_id: va_2BNgFqGdz0AqUDtKMgZgRfjG6
                  beneficiary_id: vab_z1ZkY3JrRWOwoDlc7T55CD2M1
                  amount: 2
                  currency_code: inr
                  payment_mode: neft
                  async: false
                  merchant_reference_id: '1000868'
                  payment_remark: Lego Death Star
                  metadata:
                    key_1: DD
                    key_2: XOF
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Success:
                  value: "{\n  \"id\": \"tr_aTKJAon8uLYqyk7wpP3kFAaYs\",\n  \"object\": \"transfer\",\n  \"type\": \"account_number\",\n  \"amount\": 1,\n  \"debit_account_id\": \"va_3Zk64YDxnBtyvkzWoIVUOIWHu\",\n  \"beneficiary_id\": \"vab_KT8z4g7wlXNbef9gU5IR48PCF\",\n  \"status\": \"success\",\n  \"bank_reference_number\": \"214516704238\",\n  \"currency_code\": \"inr\",\n  \"payment_mode\": \"imps\",\n  \"payment_remark\": \"Lego Death Star\",\n  \"paid_to\": \"54055602160\",\n  \"beneficiary_name\": \"Sunil Reddy\",\n  \"beneficiary_ifsc\": \"HDFC0000123\",\n  \"otp_attempts\": 0,\n  \"metadata\": {\n    \"key_1\": \"DD\",\n    \"key_2\": \"XOF\"\n  },\n  \"merchant_reference_id\": \"1000077\",\n  \"transacted_at\": 1653476654,\n  \"is_sandbox\": false,\n  \"created_at\": 1653476653\n}"
