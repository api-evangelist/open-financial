                email_id:
                  type: string
                  description: Email Id of the customer
                currency:
                  type: string
                  description: INR
                mtx:
                  type: string
                  description: Reference id for the transaction. This should be unique for each transaction.
                sub_accounts_id:
                  type: string
                  description: Mandatory Only in case of Split settlement use-case
