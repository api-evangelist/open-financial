                          name_of_account_holder:
                            type: string
                            description: 'Beneficiary''s name.<br><br>Supported characters: <ul><li>`a-z`</li><li>`A-Z`</li><li>`0-9`</li><li>`space`</li><li>`’`</li><li>`-`</li><li>`_`</li><li>`/`</li><li>`(`</li><li>`)`</li><li>`.`</li><li>`&`</li><li>`#`</li><li>`$`</li><li>`@`</ul></li>Example: `Anil Reddy`'
                          bank_account_number:
                            type: string
                            description: 'Beneficiary''s bank account number.<br><br>Example: `98765432101234`'
                          bank_ifsc_code:
                            type: string
                            description: 'Beneficiary''s bank IFSC.<br><br>Example: `HDFC0000123`'
                          vpa:
                            type: string
                            description: Required when type is vpa
                      amount:
                        type: number
                        description: 'The amount you want to transfer in Rs.<br><br>Example: `369.61`'
